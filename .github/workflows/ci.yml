name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */target/surefire-reports
            */target/failsafe-reports

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type-check and build
        working-directory: web
        run: npm run build

  chaos:
    name: Chaos smoke test (fake model)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose --profile chaos build

      - name: Start Postgres, receiver and API
        run: docker compose up -d postgres receiver api

      - name: 40 kill -9 trials and 5 zombie trials
        env:
          TRIALS: "40"
          PAUSE_TRIALS: "5"
        run: docker compose --profile chaos run --rm chaos

      - name: Upload chaos report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: chaos-results

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color api receiver
